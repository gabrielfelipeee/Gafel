<a
  [routerLink]="item().path"
  (click)="onClick()"
  routerLinkActive="text-primary"
  #rla="routerLinkActive"
  class="group relative flex items-center gap-3 rounded-xl px-3 py-2 transition-all duration-200 hover:bg-primary/10 hover:text-primary"
>
  @if (rla.isActive) {
  <span class="absolute left-0 h-7 w-1 rounded-r-full bg-primary"></span>
  }

  <span
    class="flex h-10 w-10 items-center justify-center rounded-full transition-all duration-200 group-hover:bg-primary/15"
  >
    <ng-icon [name]="item().icon" size="20" />
  </span>

  <span class="font-medium"> {{ item().label }} </span>
</a>
