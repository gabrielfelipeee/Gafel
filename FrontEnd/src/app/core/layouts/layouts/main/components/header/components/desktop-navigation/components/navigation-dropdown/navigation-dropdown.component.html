<div class="dropdown dropdown-start">
  <button
    tabindex="0"
    class="group relative flex cursor-pointer items-center gap-2 transition-colors duration-300 hover:text-primary"
    [class.text-primary]="isDropDownActive()"
  >
    <ng-icon [name]="item().icon" [size]="isDesktop() ? '26' : '18'" />

    <span class="font-semibold text-[12px] lg:text-base"> {{ item().label }} </span>

    <ng-icon name="heroChevronDown" [size]="isDesktop() ? '18' : '12'" />

    <!-- ACTIVE LINE -->
    <span
      class="absolute left-0 -bottom-1 h-px w-full bg-primary transition-transform duration-300 ease-[cubic-bezier(.65,0,.35,1)]"
      [ngClass]="{
          'origin-left scale-x-100': isDropDownActive(),
          'origin-right scale-x-0': !isDropDownActive()
        }"
    ></span>
  </button>

  <!-- DROPDOWN -->
  <div
    tabindex="-1"
    class="dropdown-content z-1 mt-4 w-60 lg:w-72 rounded-xl border border-base bg-base-100 p-4 shadow-lg"
  >
    <!-- ARROW -->
    <span
      class="absolute -top-2 left-6 h-4 w-4 rotate-45 border-l border-t border-base bg-base-100"
    ></span>

    <!-- ITEMS -->
    <div class="flex flex-col gap-1">
      @for (item of item().items; track $index) {
      <app-navigation-item [item]="item" (clicked)="onCloseDropdown()" />
      }
    </div>
  </div>
</div>
