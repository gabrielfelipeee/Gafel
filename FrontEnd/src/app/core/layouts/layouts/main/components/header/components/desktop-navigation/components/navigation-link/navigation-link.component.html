<a
  [routerLink]="item().path"
  routerLinkActive
  #rla="routerLinkActive"
  class="group relative flex cursor-pointer items-center gap-2 transition-colors duration-300 hover:text-primary pt-0 -mt-[6px]"
  [class.text-primary]="rla.isActive"
>
  <ng-icon [name]="item().icon" [size]="isDesktop() ? '26' : '18'" />

  <span class="font-semibold text-[12px] lg:text-base"> {{ item().label }} </span>

  <!-- ACTIVE LINE -->
  <span
    class="absolute left-0 -bottom-1 h-px w-full bg-primary transition-transform duration-300 ease-[cubic-bezier(.65,0,.35,1)]"
    [ngClass]="{
          'origin-left scale-x-100': rla.isActive,
          'origin-right scale-x-0': !rla.isActive
        }"
  ></span>
</a>
