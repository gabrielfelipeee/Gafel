<label for="drawer-menu" aria-label="close sidebar" class="drawer-overlay"></label>

<aside class="relative min-h-full w-80 bg-base-200 p-4">
  <!-- CLOSE -->
  <button
    (click)="closeDrawer()"
    class="btn btn-circle absolute top-2 right-2 border-none bg-inherit shadow-none transition-all duration-300 hover:rotate-12 hover:border-primary hover:bg-primary/7 group"
  >
    <ng-icon
      name="heroXMark"
      size="22"
      class="text-neutral! transition-colors duration-300 group-hover:text-primary!"
    />
  </button>

  <!-- LOGO -->
  <div class="mt-8 mb-6 flex justify-center">
    <app-logo />
  </div>

  <!-- NAV -->
  <nav class="flex flex-col gap-1">
    @for (feature of features(); track feature.label) {

    <a
      [routerLink]="feature.path"
      routerLinkActive
      #rla="routerLinkActive"
      [routerLinkActiveOptions]="matchOptions"
      class="group relative flex items-center gap-4 rounded-xl p-2 transition-all duration-200 hover:bg-primary/10 hover:text-primary"
      [class.bg-primary/10]="rla.isActive"
      [class.text-primary]="rla.isActive"
      (click)="closeDrawer()"
    >
      <!-- ICON -->
      <span
        class="flex h-9 w-9 items-center justify-center rounded-full transition-all duration-200 group-hover:bg-primary/7"
        [class.bg-primary/7]="rla.isActive"
      >
        <ng-icon [name]="feature.icon" size="20" />
      </span>

      <!-- LABEL -->
      <span class="font-semibold text-base"> {{ feature.label }} </span>

      <!-- ACTIVE LINE -->
      <span
        class="absolute left-0 top-1/2 h-8 w-1 -translate-y-1/2 rounded-r-full bg-primary transition-all duration-300"
        [ngClass]="{
          'opacity-100 scale-y-100': rla.isActive,
          'opacity-0 scale-y-0': !rla.isActive
        }"
      ></span>
    </a>
    }
  </nav>
</aside>
