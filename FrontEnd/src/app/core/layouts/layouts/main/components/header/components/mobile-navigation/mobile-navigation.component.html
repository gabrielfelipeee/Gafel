<!-- Dock -->
<div class="dock dock-md">
  @for (item of BOTTOM_NAVIGATION_ITEMS; track $index) {
  <a
    [routerLink]="item.path"
    routerLinkActive="text-primary"
    [routerLinkActiveOptions]="matchOptions"
  >
    <ng-icon [name]="item.icon" size="22" />
    <span class="dock-label">{{item.label}}</span>
  </a>
  }

  <button (click)="onOpenMenu()" [class.text-primary]="isMoreMenuActive()">
    <ng-icon name="heroBars3" size="22" />
    <span class="dock-label">Menu</span>
  </button>
</div>

<!-- Bottom Sheet -->
<dialog #bottomSheet class="modal modal-bottom">
  <div class="modal-box rounded-t-xl p-0">
    <!-- Handle -->
    <div class="h-1.5 w-12 rounded-full bg-base-300 mx-auto my-3"></div>

    <!-- Header -->
    <div class="flex items-center justify-between px-4 pb-3 mb-3 border-b border-base">
      <div>
        <h2 class="font-bold text-lg capitalize">mais opções</h2>

        <p class="text-sm opacity-60">Acesse outras funcionalidades</p>
      </div>

      <app-icon-button (clicked)="onCloseMenu()" icon="heroXMark" />
    </div>

    <!-- Grid -->
    <div class="grid grid-cols-3 gap-4 px-4 pb-8">
      @for (item of MORE_NAVIGATION_ITEMS; track $index) {
      <a
        [routerLink]="item.path"
        routerLinkActive="text-primary"
        [routerLinkActiveOptions]="matchOptions"
        (click)="onCloseMenu()"
        class="group flex flex-col items-center gap-2 rounded-xl p-2 transition-colors duration-300 hover:bg-base-200 hover:text-primary"
      >
        <ng-icon [name]="item.icon" size="32" />

        <span class="text-center text-xs font-medium leading-tight"> {{ item.label }} </span>
      </a>
      }
    </div>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button>Fechar</button>
  </form>
</dialog>
