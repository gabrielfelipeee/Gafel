<div class="drawer">
  <input id="drawer-menu" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col">
    <div class="navbar justify-between p-0">
      <!-- BURGER + LOGO -->
      <div class="flex items-center gap-4">
        <label
          for="drawer-menu"
          class="btn btn-circle group bg-inherit border-none shadow-none transition-all duration-300 hover:rotate-12 hover:border-primary hover:bg-primary/7 md:hidden"
        >
          <ng-icon
            name="heroBars3"
            size="26"
            class="text-neutral! transition-colors duration-300 group-hover:text-primary!"
          />
        </label>

        <app-logo class="hidden sm:block" />
      </div>

      <app-navigation [features]="features" />

      <!-- CONFIG -->
      <div class="flex items-center gap-4">
        <button
          (click)="toggleTheme()"
          class="btn btn-circle group bg-inherit border-none shadow-none transition-all duration-300 hover:rotate-12 hover:bg-primary/7"
        >
          <ng-icon
            [name]="theme() === 'gafel-dark' ? 'heroSun' : 'heroMoon'"
            size="22"
            class="text-neutral! transition-colors duration-300 group-hover:text-primary!"
          />
        </button>

        <div class="flex items-center gap-2">
          <span
            class="flex h-8 w-8 items-center justify-center rounded-full border border-primary bg-primary/7 text-primary"
          >
            <ng-icon name="heroUser" size="22" />
          </span>

          <span class="text-display font-mono"> {{ fullName }} </span>
        </div>
      </div>
    </div>
  </div>

  <app-drawer [features]="featuresList" />
</div>
