@if(!route.firstChild || !isMobile()) {
<h1 class="font-semibold text-3xl capitalize">contas bancárias</h1>

<div
  class="flex flex-col justify-center gap-8 border-b border-primary/20 py-4 mb-4 sticky top-0 z-10 bg-base-100"
>
  <div class="flex items-center justify-end md:justify-between gap-4">
    @if (!isMobile()) {
    <div class="flex items-center justify-center gap-1">
      <app-icon-button
        icon="heroListBullet"
        [selected]="viewMode() === 'list'"
        (clicked)="onViewModeChange('list')"
      />
      <app-icon-button
        icon="heroSquares2x2"
        [selected]="viewMode() === 'grid'"
        (clicked)="onViewModeChange('grid')"
      />
    </div>
    }

    <app-button icon="heroPlus" (clicked)="onCreateOrEditBankAccount()">nova conta</app-button>
  </div>

  <input
    type="text"
    placeholder="Pesquisar..."
    class="input input-md outline-none border-primary w-full max-w-100"
    [formControl]="searchControl"
  />
</div>
@if(response().items.length) { @if(viewMode() === 'grid') {
<app-bank-account-grid
  [bankAccounts]="response().items"
  [isLoading]="isLoading()"
  [actions]="actions"
  (action)="handleBankAccountAction($event)"
/>
} @else {
<app-bank-account-list
  [bankAccounts]="response().items"
  [isLoading]="isLoading()"
  [actions]="actions"
  (action)="handleBankAccountAction($event)"
  [selectedBankAccountIds]="selectedBankAccountIds"
  (bankAccountSelectionChange)="onBankAccountSelectionChange($event)"
  (allBankAccountsSelectionChange)="onAllBankAccountsSelectionChange($event)"
/>
} } @else if(isLoading()) {
<app-content-skeleton [totalItems]="3" [viewMode]="'grid'" />
} @else {
<app-empty-list
  title="Nenhuma conta bancária encontrada"
  description="Não encontramos nenhuma conta com os filtros ou termo de pesquisa informados."
/>
}

<app-paginator
  [limits]="BANK_ACCOUNT_LIMIT_OPTIONS"
  [totalItems]="response().total"
  [offset]="response().offset"
  [limit]="response().limit"
  (offsetChange)="onOffsetChange($event)"
  (limitChange)="onLimitChange($event)"
/>
}

<router-outlet />
