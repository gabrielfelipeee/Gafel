<app-modal (modalClose)="onModalClose()">
  <h1 class="text-2xl font-bold tracking-tight">Nova Categoria</h1>

  <p class="text-sm text-base-content/70 mt-1 pb-2 border-b border-base">
    Crie categorias para organizar suas movimentações.
  </p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid gap-4 mt-6">
    <app-custom-radio-group
      [options]="categoryTypeOptions"
      [value]="form.controls.type.value"
      (valueChange)="onSelectCategoryType($event)"
    />

    <app-custom-input
      label="Nome"
      icon="heroHashtag"
      placeholder="Dê um nome à categoria"
      formControlName="name"
      [errorMessages]="formErrorMessages.name"
    />

    <div class="grid gap-2 border-b border-base pb-6">
      <span class="text-base font-semibold">Escolha o ícone</span>
      <ul class="list-none flex justify-center items-center flex-wrap gap-4">
        @for (icon of CATEGORY_ICON_NAMES; track $index) {
        <li>
          <button
            type="button"
            (click)="onSelectIcon(icon)"
            class="icon-container icon-container-hover cursor-pointer"
            [class.icon-container--active]="selectedIcon() === icon"
          >
            <ng-icon [name]="icon" size="32" />
          </button>
        </li>
        }
      </ul>
      <div class="h-5">
        @if (form.controls.icon.hasError('required') && form.controls.icon.touched) {
        <span class="text-error text-sm animate-fade-in-up">
          {{formErrorMessages.icon.required}}
        </span>
        }
      </div>
    </div>

    <app-button icon="heroPlus" class="justify-self-end">adicionar</app-button>
  </form>
</app-modal>
