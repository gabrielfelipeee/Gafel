<div
  class="grid gap-2 font-mono font-semibold md:gap-4 text-xs md:text-sm"
  [style.grid-template-columns]="'repeat(' + options().length + ', minmax(0, 1fr))'"
>
  @for (option of options(); track $index) {
  <button
    type="button"
    (click)="onClick(option.value)"
    class="group flex items-center justify-center gap-2 uppercase outline-none border border-base rounded-xl py-2.5 px-2 cursor-pointer transition-all duration-300"
    [ngClass]="{
      'pointer-events-none border-transparent': option.value === value(),

      'hover:border-neutral': !option?.variant,
      'bg-base-300': option.value === value() && !option?.variant,

      'hover:border-success hover:text-success': option?.variant === 'success',
      'bg-success text-success-content': option.value === value() && option?.variant === 'success',

      'hover:border-warning hover:text-warning': option?.variant === 'warning',
      'bg-warning text-warning-content': option.value === value() && option?.variant === 'warning',

      'hover:border-error hover:text-error': option?.variant === 'error',
      'bg-error text-error-content': option.value === value() && option?.variant === 'error',
    }"
    [disabled]="disabled()"
  >
    @if (option.icon) {
    <ng-icon
      [name]="option.icon"
      size="18"
      class="hidden! sm:flex! sm:shrink-0 transition-transform duration-500 group-hover:scale-110"
    />
    }

    <span class="sm:tracking-widest"> {{ option.label }} </span>
  </button>
  }
</div>
